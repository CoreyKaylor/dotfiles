# Ghostty settings shared by every machine.
#
# Stow links this file; it is not ~/.config/ghostty/config. That file stays
# machine-local because Omarchy's `omarchy font set` and `omarchy display
# text-size` rewrite it in place (sed -i would replace a stow symlink).
# install.sh adds `config-file = ?dotfiles.conf` to it. Ghostty loads an
# included file after the one that includes it, so settings here win over
# the local config. Keep font-family and font-size local for that reason.

# Send Option as Alt so Alt-hjkl reaches herdr (no effect off macOS).
macos-option-as-alt = true

# Send Shift+Enter as CSI-u so TUIs (Claude Code, nvim) can tell it from Enter.
keybind = shift+enter=csi:13;2u
