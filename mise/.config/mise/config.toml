[env]
LC_ALL = "en_US.UTF-8"

# Arch's dotnet-host sets DOTNET_ROOT=/usr/share/dotnet (root-owned), which
# mise's shared dotnet install would target. Isolated gives each SDK its own
# dir under installs/ and points DOTNET_ROOT there when activated.
[settings.dotnet]
isolated = true

[tools]
"cargo:cargo-audit" = "latest"
dotnet = "11.0.100"
flyctl = "latest"
go = "1.25.0"
gradle = "8.14.3"
java = "openjdk-21.0.2"
lua = "5.4.8"
node = "24.5.0"
"npm:cf" = { version = "latest", minimum_release_age = "0s", lazy = true, lazy_bins = ["cf"] }
"npm:neonctl" = "latest"
"npm:wrangler" = "latest"
python = "3.13.5"
ruby = "3.4.4"
rust = "latest"
stripe = "latest"
